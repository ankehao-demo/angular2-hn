language: node_js
node_js:
  - "18"

branches:
  only:
    - master

install:
  - npm ci

script:
  - npm run lint
  - npm test -- --run
  - npm run build

after_success:
  - npm install -g firebase-tools
  - firebase use default
  - firebase deploy --token $FIREBASE_TOKEN

notifications:
  email:
    on_failure: change
    on_success: change
