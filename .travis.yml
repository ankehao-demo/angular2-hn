language: node_js
node_js:
  - "18"

branches:
  only:
    - master

before_script:
  - npm install -g firebase-tools
  - cd react-hn && npm install

script:
  - npm run lint
  - npm run test
  - npm run build

after_success:
  - firebase use default
  - firebase deploy --token $FIREBASE_TOKEN

notifications:
  email:
    on_failure: change
    on_success: change
